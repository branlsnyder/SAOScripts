[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "stable-audio-scripts"
version = "0.1.0"
description = "CLI tools for audio generation with Stable Audio Open"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "soundfile>=0.13.0",
    "einops>=0.8.0",
    "numpy>=1.23.5",
    "stable-audio-tools==0.0.19",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["audio_utils", "output_naming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
